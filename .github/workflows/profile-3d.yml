name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: nicodolas

      - name: Generate Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=nicodolas&theme=radical&no-frame=true&no-bg=true&column=7'
          path: profile-3d-contrib/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make SVG backgrounds transparent
        run: |
          python3 -c "
          import glob, re
          for f in glob.glob('profile-3d-contrib/*.svg'):
              with open(f, 'r') as file:
                  data = file.read()
              new_data = re.sub(r'\.fill-bg\s*\{\s*fill\s*:\s*[^;]+;\s*\}', '.fill-bg { fill: none; }', data)
              with open(f, 'w') as file:
                  file.write(new_data)
          "

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update 3d contribution graph"; then
            git pull --rebase origin main
            git push origin main
          fi
