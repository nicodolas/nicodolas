<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradient for Waves -->
    <linearGradient id="footer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop id="foot-stop-1" offset="0%" stop-color="#6EA4B8" stop-opacity="0.85" />
      <stop id="foot-stop-2" offset="50%" stop-color="#9B84B2" stop-opacity="0.85" />
      <stop id="foot-stop-3" offset="100%" stop-color="#B85B88" stop-opacity="0.85" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      /* Floating Star Particles */
      .star {
        fill: #A8B2C1;
        animation: twinkle 3s infinite ease-in-out;
        transform-origin: center;
      }
      .star-f1 { animation-delay: 0s; }
      .star-f2 { animation-delay: 1s; }
      .star-f3 { animation-delay: 2s; }

      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.2); }
      }

      /* Glowing Text */
      .closing-text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 15px;
        fill: #6D558A;
        text-anchor: middle;
        letter-spacing: 5px;
        animation: pulse 3s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      /* Slow Wave Animation */
      .glow-wave {
        fill: none;
        stroke: url(#footer-grad);
        stroke-width: 1.5;
        filter: url(#neon-glow);
        stroke-dasharray: 800, 200;
        animation: wave-slide 12s infinite linear;
      }

      @keyframes wave-slide {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }

      /* Dark Mode overrides */
      @media (prefers-color-scheme: dark) {
        .star {
          fill: #ffffff;
        }
        .closing-text {
          fill: #BFFCC6;
        }
        #foot-stop-1 { stop-color: #A9D6E5; stop-opacity: 0.7; }
        #foot-stop-2 { stop-color: #D8B4F8; stop-opacity: 0.7; }
        #foot-stop-3 { stop-color: #FFC6FF; stop-opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- Twinkling stars -->
  <circle class="star star-f1" cx="200" cy="80" r="1" />
  <circle class="star star-f2" cx="350" cy="40" r="1.5" />
  <circle class="star star-f3" cx="500" cy="90" r="1" />
  <circle class="star star-f1" cx="680" cy="50" r="2" />
  <circle class="star star-f2" cx="780" cy="80" r="1.2" />

  <!-- Animated waves -->
  <path class="glow-wave" d="M 0 30 C 200 60, 400 0, 600 30 C 750 50, 850 10, 900 30" />
  <path class="glow-wave" d="M 0 50 C 150 10, 350 70, 550 40 C 700 20, 800 60, 900 45" style="animation-duration: 18s; stroke-opacity: 0.5;" />

  <!-- Closing text -->
  <text class="closing-text" x="450" y="115">> MISSION COMPLETE. LOG_BOOK CLOSED. VOYAGE CONTINUES...</text>
</svg>
