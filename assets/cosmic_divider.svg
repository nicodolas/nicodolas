<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="60">
  <defs>
    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradient for Wave -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop id="wave-stop-1" offset="0%" stop-color="#6EA4B8" />
      <stop id="wave-stop-2" offset="50%" stop-color="#9B84B2" />
      <stop id="wave-stop-3" offset="100%" stop-color="#B85B88" />
    </linearGradient>

    <style>
      /* Glowing Neon Line Animation */
      .glow-line {
        fill: none;
        stroke: url(#wave-grad);
        stroke-width: 2;
        filter: url(#neon-glow);
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw-line 8s infinite linear;
      }

      @keyframes draw-line {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }

      /* Floating Star Particles */
      .particle {
        fill: #A8B2C1;
        opacity: 0.8;
        transform-origin: center;
        animation: float-particle 4s infinite ease-in-out;
      }
      .p-1 { animation-delay: 0s; }
      .p-2 { animation-delay: 1.3s; }
      .p-3 { animation-delay: 2.6s; }

      @keyframes float-particle {
        0%, 100% { transform: translateY(0px) scale(0.6); opacity: 0.2; }
        50% { transform: translateY(-8px) scale(1.2); opacity: 1; }
      }

      /* Dark Mode overrides */
      @media (prefers-color-scheme: dark) {
        .particle {
          fill: #fff;
        }
        #wave-stop-1 { stop-color: #A9D6E5; }
        #wave-stop-2 { stop-color: #D8B4F8; }
        #wave-stop-3 { stop-color: #FFC6FF; }
      }
    </style>
  </defs>

  <!-- Twinkling floating particles -->
  <circle class="particle p-1" cx="150" cy="20" r="1.5" />
  <circle class="particle p-2" cx="320" cy="15" r="2" />
  <circle class="particle p-3" cx="480" cy="22" r="1.2" />
  <circle class="particle p-1" cx="650" cy="18" r="2" />
  <circle class="particle p-2" cx="780" cy="25" r="1.5" />

  <!-- Glowing neon sine wave -->
  <path class="glow-line" d="M 0 30 C 150 10, 300 50, 450 30 C 600 10, 750 50, 900 30" />
</svg>
